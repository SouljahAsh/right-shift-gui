plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def minecraftModsDir = providers.gradleProperty("minecraft_mods_dir")
        .orElse(providers.environmentVariable("APPDATA").map { "$it/.minecraft/mods" })
        .orElse(providers.systemProperty("user.home").map { "$it/.minecraft/mods" })

tasks.register("installClientJar", Copy) {
    dependsOn tasks.named("remapJar")
    from tasks.named("remapJar").flatMap { it.archiveFile }
    into minecraftModsDir

    doFirst {
        def targetDir = minecraftModsDir.get()
        delete fileTree(targetDir) {
            include "${project.archives_base_name}-*.jar"
        }
    }
}

tasks.named("build") {
    finalizedBy tasks.named("installClientJar")
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
